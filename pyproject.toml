[project]
name = "finance-app"
version = "0.1.0"
description = "Single-user, headless financial intelligence application: Plaid + PostgreSQL + deterministic analytics + CLI/conversational agent."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }

dependencies = [
    "typer>=0.15",
    "rich>=13.9",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "plaid-python>=33.0.0",
    "openai>=1.59",
    "anthropic>=0.40",
]

[project.scripts]
finance = "finance_app.cli.main:app"
finops = "finance_app.cli.finops:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finance_app"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "pyright>=1.1.390",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
# Alembic autogenerate produces long op.create_table(...) calls; reformatting
# them by hand would hurt readability without adding information.
"migrations/versions/*.py" = ["E501"]

[tool.pyright]
include = ["src", "tests", "evals"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: requires a running PostgreSQL test container",
    "agent_eval: requires a running PostgreSQL test container and a real configured AgentProvider credential (OPENAI_API_KEY/ANTHROPIC_API_KEY); calls a real model and spends API budget",
]
