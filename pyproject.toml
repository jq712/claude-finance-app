[project]
name = "finance-app"
version = "0.1.0"
description = "Single-user, headless financial intelligence application: Plaid + PostgreSQL + deterministic analytics + CLI/conversational agent."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }

dependencies = [
    "typer>=0.15",
    "rich>=13.9",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "plaid-python>=33.0.0",
    "openai>=1.59",
    "anthropic>=0.40",
]

[project.scripts]
finance = "finance_app.cli.main:app"
finops = "finance_app.cli.finops:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finance_app"]

[tool.uv]
# Milestone 7 `dependency-scan` CI job (pip-audit) found CVE-2026-84379,
# CVE-2026-84380, and CVE-2026-84382 in httpx2 2.10.0 -- pulled in
# transitively by `openai` (its internal HTTP client fork), not a direct
# dependency of this project. openai's own constraint (httpx2<3,>=2.7.0)
# already permits the fixed release; this override just pins to it
# explicitly instead of waiting on openai to raise its floor.
override-dependencies = ["httpx2>=2.12.0"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "pyright>=1.1.390",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# `claude-code/` (added by PRs #10/#11) is a read-only archival copy of
# repo-root docs/scripts for judge review, not live source this project's
# lint rules govern — `pyright`'s `include` below already excludes it the
# same way.
extend-exclude = ["claude-code"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
# Alembic autogenerate produces long op.create_table(...) calls; reformatting
# them by hand would hurt readability without adding information.
"migrations/versions/*.py" = ["E501"]

[tool.pyright]
include = ["src", "tests", "evals"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: requires a running PostgreSQL test container",
    "agent_eval: requires a running PostgreSQL test container and a real configured AgentProvider credential (OPENAI_API_KEY/ANTHROPIC_API_KEY); calls a real model and spends API budget",
]
