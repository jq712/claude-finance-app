name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  UV_LOCKED: "1"

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: ruff format --check
        run: uv run ruff format --check .
      - name: ruff check
        run: uv run ruff check .
      - name: pyright
        run: uv run pyright

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest tests/unit -v

  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          # The container bootstrap superuser is finance_migrator, not the
          # least-privilege finance_app runtime role — see docs/database.md.
          POSTGRES_USER: finance_migrator
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: finance_dev
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U finance_migrator -d finance_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://finance_app:devpassword@localhost:5433/finance_dev
      ALEMBIC_DATABASE_URL: postgresql+psycopg://finance_migrator:devpassword@localhost:5433/finance_dev
      BACKUP_DATABASE_URL: postgresql+psycopg://finance_backup:devpassword@localhost:5433/finance_dev
      BACKUP_ENCRYPTION_KEY: ci-test-passphrase-not-a-real-secret
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # postgresql-client-17, matching the service container above and
      # deploy/compose.yaml's postgres:17 — pg_dump/pg_restore version
      # skew is not reliably supported in the newer-server direction
      # (docs/backups.md), and ubuntu-latest's default `postgresql-client`
      # is not necessarily major version 17. gnupg is already preinstalled
      # on ubuntu-latest but declared explicitly for clarity. Mirrors the
      # Dockerfile's runtime-stage install — see that file for why each
      # package is here.
      - name: install postgresql-client-17 and gnupg (for tests/integration/test_ops_backup.py)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc > /dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17 gnupg
      - run: uv sync --locked
      - run: uv run alembic upgrade head
      - run: uv run pytest tests/integration -v -m integration

  security-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: finance_migrator
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: finance_dev
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U finance_migrator -d finance_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://finance_app:devpassword@localhost:5433/finance_dev
      ALEMBIC_DATABASE_URL: postgresql+psycopg://finance_migrator:devpassword@localhost:5433/finance_dev
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run alembic upgrade head
      - name: role-boundary tests (finance_agent must never mutate plaid.*)
        run: uv run pytest tests/security -v -m integration

  agent-evals:
    # Milestone 6 (handoff §24/§29): the golden-dataset regression harness
    # against whichever real AgentProvider(s) are configured. Calls a real
    # model and spends API budget — tests/agent_evals/conftest.py skips the
    # whole suite with pytest.skip() whenever neither OPENAI_API_KEY nor
    # ANTHROPIC_API_KEY is set, so an ordinary PR with no repo secrets
    # configured never spends budget or fails CI over a skipped suite.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: finance_migrator
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: finance_dev
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U finance_migrator -d finance_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://finance_app:devpassword@localhost:5433/finance_dev
      ALEMBIC_DATABASE_URL: postgresql+psycopg://finance_migrator:devpassword@localhost:5433/finance_dev
      AGENT_DATABASE_URL: postgresql+psycopg://finance_agent:devpassword@localhost:5433/finance_dev
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run alembic upgrade head
      - run: uv run pytest tests/agent_evals -v -m agent_eval

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docs-freshness:
    # A PR into `main` whose title or branch name identifies it as
    # completing/advancing a Milestone (the convention every Milestone 0-6
    # PR and this repo's branch names follow) must move README.md's Status
    # line in the same PR. This exists because it already happened once
    # for real: the Milestone 6 PR merged without touching README, which
    # kept claiming "Milestone 5 complete" through all of Milestone 6 and
    # well into Milestone 7 (CLAUDE.md/handoff §31 Definition of Done,
    # handoff §27's "docs as durable memory"). Scoped to base == main
    # because that is the moment a milestone actually lands and README's
    # status becomes wrong if untouched — mid-milestone implementation PRs
    # into a `milestone-N-*` integration branch inherit "milestone" in
    # their branch names without completing anything (PR #13 was the false
    # positive that proved it). Cheap, heuristic, and intentionally
    # narrow; it is not a general "are the docs stale" check.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: README Status line must move with a milestone PR
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if printf '%s\n%s\n' "$PR_TITLE" "$PR_BRANCH" | grep -qiE '(^|[^0-9])milestone[ _-]?[0-9]+'; then
            if ! git diff --name-only "$BASE_SHA"...HEAD | grep -qx 'README.md'; then
              echo "::error::This PR's title or branch name references a Milestone but does not update README.md. Update README.md's Status line in this PR (CLAUDE.md / handoff §31 Definition of Done) — or, if the milestone genuinely isn't complete yet, note that in the PR description; this check only looks for any README.md change, not a specific wording."
              exit 1
            fi
          fi

  release-preflight:
    # ADR-019's bare-metal replacement for container-build/migration-preflight/
    # staging-smoke: there is no image or registry left for a Docker-shaped
    # gate to attach to (production is a `git archive`'d release directory,
    # never an image). Production's real question is "is this SHA safe to
    # copy to /opt/finance" — `deploy/scripts/release.sh`'s own
    # first-parent-of-origin/main provenance gate already answers the
    # provenance half of that at deploy time; what CI can still usefully
    # prove *before* a PR merges is that the artifact release.sh would
    # produce actually works, mirroring its own mechanism: git-archive the
    # checked-out tree (the same non-`rsync`/non-working-tree-checkout path
    # release.sh uses, so RELEASE_ID's export-subst placeholder is
    # substituted exactly as it would be for a real release), build its
    # venv non-editable, then run a real migration and a real selfcheck
    # against a throwaway database — never `finance_dev`, never anything
    # persistent. This is what currently catches a broken migration or a
    # broken venv before anything is installed; dropping it entirely (per
    # ADR-019's own "Consequences") would be a real regression even though
    # the image-shaped gate it replaces no longer makes sense.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: finance_migrator
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: finance_ci_preflight
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U finance_migrator -d finance_ci_preflight"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ALEMBIC_DATABASE_URL: postgresql+psycopg://finance_migrator:devpassword@localhost:5433/finance_ci_preflight
      DATABASE_URL: postgresql+psycopg://finance_app:devpassword@localhost:5433/finance_ci_preflight
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: git archive the checked-out tree into a release-shaped directory
        # Extracted under a `releases/<sha>/` parent, not just any scratch
        # directory: ops/identity.py:installed_release_root() only trusts a
        # release's identity when the archived tree's *grandparent* is
        # literally named `releases` (the one structural fact release.sh's
        # own layout guarantees and an arbitrary path essentially never
        # reproduces by accident) — extracting anywhere else would make
        # `finance selfcheck`'s installed_release_id silently report `None`,
        # still `overall: healthy` but no longer the same check release.sh's
        # own layout gets in production.
        run: |
          release_dir="$RUNNER_TEMP/releases/${{ github.sha }}"
          mkdir -p "$release_dir"
          git archive --format=tar HEAD | tar -x -C "$release_dir"
          echo "RELEASE_DIR=$release_dir" >> "$GITHUB_ENV"
      - name: build the release venv (uv sync --no-editable, mirrors release.sh)
        run: uv sync --locked --no-dev --no-editable
        working-directory: ${{ env.RELEASE_DIR }}
      - name: alembic upgrade head, from the archived release's own venv
        run: .venv/bin/alembic upgrade head
        working-directory: ${{ env.RELEASE_DIR }}
      - name: finance selfcheck --json (must report overall == healthy)
        run: .venv/bin/finance selfcheck --json
        working-directory: ${{ env.RELEASE_DIR }}

  dependency-scan:
    # handoff §18 requires dependency scanning in CI; nothing did this
    # anywhere in the repo before this job. pip-audit against the exact
    # locked dependency set (uv.lock), run in an isolated `uvx`
    # environment so a vulnerable transitive dependency in the scan tool
    # itself can't taint this project's own resolved environment.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv export --locked --no-dev --no-hashes -o requirements.txt
      - run: uvx pip-audit --requirement requirements.txt

  # --------------------------------------------------------------------
  # CD (handoff §19, ADR-007, ADR-008): everything below this line runs
  # only on a push to `main`, only after every job above is green, and
  # only in this order. It is one pipeline, not a second workflow, so
  # "after CI is green" is an ordinary `needs:` edge rather than a
  # cross-workflow `workflow_run` dependency.
  # --------------------------------------------------------------------

  production-deploy:
    # No production VPS exists yet (handoff §29 Milestone 7 is building
    # the deployable artifacts, not operating a live host — see this PR's
    # description). This job is therefore intentionally a documented
    # no-op gate, not a faked deploy target: it records that the release
    # is built, preflighted, and eval-clean, and tells the owner the one
    # remaining step is theirs.
    #
    # `environment: production` is the actual gate — configure this
    # environment's required reviewers once in GitHub repo Settings ->
    # Environments -> production (docs/deployment.md); until that's done
    # this job runs unattended, which is fine pre-VPS but must be set
    # before it means anything for a real deploy.
    needs: [release-preflight, agent-evals]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: record release readiness
        run: |
          {
            echo "## Release ready: \`${{ github.sha }}\`"
            echo
            echo "\`${{ github.sha }}\` passed CI (lint/typecheck, unit, integration, security, dependency-scan, secret-scan), bare-metal release-preflight (git-archived, built a non-editable venv, migrated, and selfchecked healthy against a throwaway database), and (if provider credentials are configured) critical agent evals."
            echo
            echo "**No production VPS is provisioned yet.** Per ADR-007/ADR-010, this pipeline never SSHes into or deploys onto a host on its own — the owner runs \`deploy/scripts/release.sh ${{ github.sha }}\` followed by \`finops deploy ${{ github.sha }}\` on the VPS once it exists. See docs/deployment.md and docs/runbooks/deploy.md for the exact provisioning and first-deploy procedure."
          } >> "$GITHUB_STEP_SUMMARY"
